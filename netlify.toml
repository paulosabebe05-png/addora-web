[build]
  command   = "npm run build"
  publish   = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Redirects ─────────────────────────────────────────────────────────────────
# Force all Netlify subdomain traffic to real domain

[[redirects]]
  from       = "/*"
  to         = "https://addora.com.et/:splat"
  status     = 301
  force      = true
  conditions = {Host = ["addoraweb.netlify.app", "master--addoraweb.netlify.app"]}

# ── Cache headers ─────────────────────────────────────────────────────────────
# Netlify CDN was overriding Next.js with max-age=0,must-revalidate on images.
# These rules fix that — images now cache for 30 days on the edge + browser.

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
